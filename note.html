<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=contain, minimal-ui">
    <title>M Note</title>

    <!-- Generic Web App & Theme -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="icon/m-note-manifest.json">

    <!-- Apple / iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Generic Web App & iOS Dynamic Theme Color -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-title" content="M Note">
    <link rel="apple-touch-icon" href="icon/m-note-icon-192.png">

    <!-- Windows / Microsoft Support -->
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="icon/m-note-icon-192.png">
    <meta name="msapplication-tap-highlight" content="no">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icon/m-note-icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/m-note-icon-16.png">

    <style>
        :root {
            --bg-body: #f8fafc;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --btn-bg: #475569;
            --btn-hover: #334155;
            --btn-text: #ffffff;
            --btn-add-bg: #0284c7;
            --btn-add-hover: #0369a1;
            --badge-bg: rgba(255, 255, 255, 0.2);
            --content-bg: #ffffff;
            --line-num-color: #94a3b8;
            --total-bg: #e2e8f0;
            --sup-color: #64748b;
            --scrollbar-thumb: rgba(120, 120, 120, 0.7);

            /* Theme Status Colors */
            --status-success-bg: #22c55e;
            --status-success-text: #ffffff;
            --status-warning-bg: #eab308;
            --status-warning-text: #0f172a;
            --status-danger-bg: #ef4444;
            --status-danger-text: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --text-color: #f1f5f9;
                --border-color: #334155;
                --btn-bg: #1e293b;
                --btn-hover: #334155;
                --btn-text: #f8fafc;
                --btn-add-bg: #0284c7;
                --btn-add-hover: #0ea5e9;
                --badge-bg: rgba(255, 255, 255, 0.1);
                --content-bg: #233046;
                --line-num-color: #64748b;
                --total-bg: #334155;
                --sup-color: #94a3b8;
                --scrollbar-thumb: rgba(255, 255, 255, 0.3);

                --status-success-bg: #15803d;
                --status-success-text: #f8fafc;
                --status-warning-bg: #ca8a04;
                --status-warning-text: #f8fafc;
                --status-danger-bg: #b91c1c;
                --status-danger-text: #f8fafc;
            }
        }

        /* Manual override class */
        body.dark-mode {
            --bg-body: #0f172a;
            --text-color: #f1f5f9;
            --border-color: #334155;
            --btn-bg: #1e293b;
            --btn-hover: #334155;
            --btn-text: #f8fafc;
            --btn-add-bg: #0284c7;
            --btn-add-hover: #0ea5e9;
            --badge-bg: rgba(255, 255, 255, 0.1);
            --content-bg: #233046;
            --line-num-color: #64748b;
            --total-bg: #334155;
            --sup-color: #94a3b8;
            --scrollbar-thumb: rgba(255, 255, 255, 0.3);

            --status-success-bg: #15803d;
            --status-success-text: #f8fafc;
            --status-warning-bg: #ca8a04;
            --status-warning-text: #f8fafc;
            --status-danger-bg: #b91c1c;
            --status-danger-text: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        *::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }

        *::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0 1rem;
            background-color: var(--bg-body);
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Weekly Layout */
        /* Sticky Weekly Header */
        #weekly {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-body);
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .weekly-row {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .weekly-col {
            flex: 1;
            position: relative;
            padding: 0.5em;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        .weekly-col::after {
            content: attr(data-days);
            position: absolute;
            bottom: 2px;
            right: 6px;
            font-size: 11px;
            font-weight: normal;
            opacity: 0.85;
        }

        .weekly-col.state-success {
            background-color: var(--status-success-bg);
            color: var(--status-success-text);
        }

        .weekly-col.state-warning {
            background-color: var(--status-warning-bg);
            color: var(--status-warning-text);
        }

        .weekly-col.state-danger {
            background-color: var(--status-danger-bg);
            color: var(--status-danger-text);
        }

        .weekly-btn-reset {
            display: none;
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
        }

        .weekly-btn-reset.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Daily Section */
        #daily {
            width: 100%;
        }

        .collapsible {
            margin-bottom: 2px;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 4px 4px;
            overflow: visible;
        }



        /* Sticky Collapsible Button right below #weekly */
        .btn-collapsible {
            border: none;
            border-top: 1px solid var(--border-color);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            padding: 0.75em 1em;
            width: 100%;
            text-align: left;
            outline: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-user-select: none;
            user-select: none;
            position: sticky;
            top: 5.85rem;
            /* Chiều cao khớp phía dưới #weekly */
            z-index: 10;
        }

        .btn-collapsible:hover {
            background-color: var(--btn-hover);
        }

        .btn-collapsible::before {
            content: "►";
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 1.5em;
            margin-right: 0.5em;
            font-size: 12px;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .collapsible.active .btn-collapsible::before {
            transform: rotate(90deg);
        }

        .btn-collapsible::after {
            content: attr(data-total);
            margin-left: auto;
            font-weight: bold;
            font-size: 14px;
            background-color: var(--badge-bg);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .btn-collapsible .del-collapsible {
            background-color: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .content {
            height: 55vh;
            padding: 0.5em;
            display: none;
            overflow-y: auto;
            background-color: var(--content-bg);
            counter-reset: line-num -7;
            outline: none;
        }

        .collapsible.active .content {
            display: block;
        }

        .content p {
            margin: 0;
            padding: 2px 0 2px 2em;
            position: relative;
            min-height: 1.25em;
            line-height: 1.25em;
            counter-increment: line-num;
            outline: none;
            word-break: break-word;
        }

        .content p::before {
            content: counter(line-num);
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 1.5em;
            text-align: right;
            color: var(--line-num-color);
            font-size: 12px;
            -webkit-user-select: none;
            user-select: none;
        }

        .content p:nth-child(-n+7)::before {
            content: "";
        }

        #btn-add-collapsible {
            display: block;
            width: 100%;
            padding: 0.75em;
            background-color: var(--btn-add-bg);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        #btn-add-collapsible:hover {
            background-color: var(--btn-add-hover);
        }

        #total-section-value,
        .total {
            font-size: 18px;
            font-weight: bold;
            padding: 0.5em 1em;
            background-color: var(--total-bg);
            border-radius: 4px;
            text-align: right;
            -webkit-user-select: none;
            user-select: none;
        }

        .total sup {
            font-size: 0.67em;
            color: var(--sup-color);
        }

        #backup-collapsible {
            display: none;
            width: 100%;
            height: 55vh;
            resize: none;
            margin-top: 10px;
            padding: 0.5em;
            box-sizing: border-box;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 16px;
            color: var(--text-color);
            background-color: var(--content-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #backup-collapsible.active {
            display: block;
        }

        #backup-collapsible:focus {
            border-color: var(--btn-add-bg);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="weekly">
            <div class="weekly-row">
                <div class="weekly-col" id="col-TRIM" data-key="TRIM">TRIM <button
                        class="weekly-btn-reset">RESET</button></div>
                <div class="weekly-col" id="col-CIP_T" data-key="CIP_T">CIP-T <button
                        class="weekly-btn-reset">RESET</button></div>
                <div class="weekly-col" id="col-CIP_D" data-key="CIP_D">CIP-D <button
                        class="weekly-btn-reset">RESET</button></div>
            </div>
            <div class="weekly-row">
                <div class="weekly-col" id="col-BTH" data-key="BTH">BTH</div>
                <div class="weekly-col" id="col-EXE" data-key="EXE">EXE</div>
            </div>
        </div>
        <div id="daily">
            <div id="total-section-value" class="total"></div>
            <button type="button" id="btn-add-collapsible">+</button>
            <textarea id="backup-collapsible" placeholder="JSON Backup"></textarea>
        </div>
    </div>

    <script>
        const dailyContainer = document.querySelector("#daily");
        const DB_NAME = "AppDatabase";
        const DB_VERSION = 1;
        const STORE_SECTIONS = "sections";
        const STORE_APP_STATE = "appState";

        let db = null;

        // --- Date Helpers ---
        function getStartOfWeekSunday(date) {
            const d = new Date(date);
            const day = d.getDay();
            d.setDate(d.getDate() - day);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function getDaysDiff(fromDateISO) {
            const from = new Date(fromDateISO);
            from.setHours(0, 0, 0, 0);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffTime = today - from;
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }

        // --- IndexedDB Setup ---
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_SECTIONS)) {
                        database.createObjectStore(STORE_SECTIONS, { keyPath: "index" });
                    }
                    if (!database.objectStoreNames.contains(STORE_APP_STATE)) {
                        database.createObjectStore(STORE_APP_STATE, { keyPath: "key" });
                    }
                };

                request.onsuccess = async (e) => {
                    db = e.target.result;
                    await setupWeeklyDefaultKeys();
                    resolve(db);
                };

                request.onerror = (e) => reject(e.target.error);
            });
        }

        function getStateFromDB(key) {
            return new Promise((resolve) => {
                if (!db) return resolve(null);
                const tx = db.transaction(STORE_APP_STATE, "readonly");
                const req = tx.objectStore(STORE_APP_STATE).get(key);
                req.onsuccess = () => resolve(req.result ? req.result.value : null);
                req.onerror = () => resolve(null);
            });
        }

        function saveStateToDB(key, value) {
            if (!db) return;
            const tx = db.transaction(STORE_APP_STATE, "readwrite");
            tx.objectStore(STORE_APP_STATE).put({ key: key, value: value });
        }

        function getAllAppStateFromDB() {
            return new Promise((resolve) => {
                if (!db) return resolve([]);
                const tx = db.transaction(STORE_APP_STATE, "readonly");
                const req = tx.objectStore(STORE_APP_STATE).getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        }

        async function setupWeeklyDefaultKeys() {
            const today = new Date();
            const sunday = getStartOfWeekSunday(today);

            const defaults = [
                { key: "PATIENT_ZERO_TRIM", value: sunday.toISOString() },
                { key: "PATIENT_ZERO_TRIM_RESET", value: true },
                { key: "PATIENT_ZERO_CIP_T", value: today.toISOString() },
                { key: "PATIENT_ZERO_CIP_T_RESET", value: true },
                { key: "PATIENT_ZERO_CIP_D", value: today.toISOString() },
                { key: "PATIENT_ZERO_CIP_D_RESET", value: true }
            ];

            for (const item of defaults) {
                const existing = await getStateFromDB(item.key);
                if (existing === null || existing === undefined) {
                    saveStateToDB(item.key, item.value);
                }
            }
        }

        function saveSectionToDB(sectionIndex) {
            if (!db) return;

            const sections = document.querySelectorAll(".collapsible");
            const section = sections[sectionIndex];
            if (!section) return;

            const btn = section.querySelector(".btn-collapsible");
            const content = section.querySelector(".content");
            const paragraphs = Array.from(content.querySelectorAll("p"));

            const data = {
                index: sectionIndex,
                sectionName: btn.firstChild ? btn.firstChild.nodeValue.trim() : btn.textContent.trim(),
                "section-total": btn.getAttribute("data-total") || "0",
                "section-text": paragraphs.map(p => p.innerText.replace(/\n/g, "")),
                "is-activated": section.classList.contains("active")
            };

            const tx = db.transaction([STORE_SECTIONS, STORE_APP_STATE], "readwrite");

            // Save to STORE_SECTIONS
            tx.objectStore(STORE_SECTIONS).put(data);

            // Save state indicators to STORE_APP_STATE
            tx.objectStore(STORE_APP_STATE).put({ key: "currentEditing", value: sectionIndex });
            tx.objectStore(STORE_APP_STATE).put({ key: `section_${sectionIndex}_total`, value: data["section-total"] });
        }

        function loadAllDataFromDB() {
            return new Promise((resolve) => {
                if (!db) return resolve({ sections: [], currentEditing: null, appState: [] });

                const tx = db.transaction([STORE_SECTIONS, STORE_APP_STATE], "readonly");
                const sectionsStore = tx.objectStore(STORE_SECTIONS);
                const stateStore = tx.objectStore(STORE_APP_STATE);

                const sectionsReq = sectionsStore.getAll();
                const appStateReq = stateStore.getAll();
                const editingReq = stateStore.get("currentEditing");

                tx.oncomplete = () => {
                    resolve({
                        sections: sectionsReq.result || [],
                        appState: appStateReq.result || [],
                        currentEditing: editingReq.result ? editingReq.result.value : null
                    });
                };

                tx.onerror = () => {
                    resolve({ sections: [], appState: [], currentEditing: null });
                };
            });
        }

        async function syncAllToDB() {
            if (!db) return;
            const sections = document.querySelectorAll(".collapsible");
            const tx = db.transaction([STORE_SECTIONS, STORE_APP_STATE], "readwrite");
            const store = tx.objectStore(STORE_SECTIONS);
            const stateStore = tx.objectStore(STORE_APP_STATE);

            store.clear();

            sections.forEach((section, index) => {
                const btn = section.querySelector(".btn-collapsible");
                const content = section.querySelector(".content");
                const paragraphs = Array.from(content.querySelectorAll("p"));

                const data = {
                    index: index,
                    sectionName: btn.firstChild ? btn.firstChild.nodeValue.trim() : btn.textContent.trim(),
                    "section-total": btn.getAttribute("data-total") || "0",
                    "section-text": paragraphs.map(p => p.innerText.replace(/\n/g, "")),
                    "is-activated": section.classList.contains("active")
                };
                store.put(data);
                stateStore.put({ key: `section_${index}_total`, value: data["section-total"] });
            });

            await updateBackupInputFromDB();
        }

        async function updateBackupInputFromDB() {
            const backupInput = document.querySelector("#backup-collapsible");
            if (!backupInput || !db) return;

            const { sections, appState } = await loadAllDataFromDB();
            sections.sort((a, b) => a.index - b.index);

            const combinedBackup = {
                appState: appState,
                sections: sections
            };

            backupInput.value = JSON.stringify(combinedBackup, null, 2);
        }

        function applyBackupToDBAndUI(jsonString) {
            if (!db) return;

            try {
                const backupData = JSON.parse(jsonString);

                let sectionsData = [];
                let appStateData = [];

                if (Array.isArray(backupData)) {
                    // Backward compatibility: If array, treat as sections only
                    sectionsData = backupData;
                } else if (typeof backupData === "object" && backupData !== null) {
                    sectionsData = backupData.sections || [];
                    appStateData = backupData.appState || [];
                }

                const tx = db.transaction([STORE_SECTIONS, STORE_APP_STATE], "readwrite");
                const sectionsStore = tx.objectStore(STORE_SECTIONS);
                const stateStore = tx.objectStore(STORE_APP_STATE);

                sectionsStore.clear();
                sectionsData.forEach(item => sectionsStore.put(item));

                if (appStateData.length > 0) {
                    stateStore.clear();
                    appStateData.forEach(item => stateStore.put(item));
                }

                tx.oncomplete = () => {
                    renderWeeklyUI();
                    renderUIFromDB();
                };
            } catch (err) {
                console.error("Invalid JSON input for backup data", err);
            }
        }

        // --- Weekly UI Rendering ---
        async function renderWeeklyUI() {
            const today = new Date();
            const dayOfWeek = today.getDay();

            const trackingCols = [
                { key: "TRIM", warnDays: 26, dangerDays: 28 },
                { key: "CIP_T", warnDays: 19, dangerDays: 20 },
                { key: "CIP_D", warnDays: 9, dangerDays: 10 }
            ];

            for (const col of trackingCols) {
                const elem = document.querySelector(`#col-${col.key}`);
                if (!elem) continue;

                let zeroDate = await getStateFromDB(`PATIENT_ZERO_${col.key}`);
                let resetState = await getStateFromDB(`PATIENT_ZERO_${col.key}_RESET`);

                let diff = getDaysDiff(zeroDate);

                if (diff >= col.dangerDays) {
                    zeroDate = new Date().toISOString();
                    resetState = false;
                    saveStateToDB(`PATIENT_ZERO_${col.key}`, zeroDate);
                    saveStateToDB(`PATIENT_ZERO_${col.key}_RESET`, false);
                    diff = 0;
                } else if (diff >= col.warnDays && resetState) {
                    resetState = false;
                    saveStateToDB(`PATIENT_ZERO_${col.key}_RESET`, false);
                }

                elem.setAttribute("data-days", diff);
                elem.classList.remove("state-success", "state-warning", "state-danger");

                if (diff < col.warnDays && resetState) {
                    elem.classList.add("state-success");
                } else if (diff >= col.dangerDays || !resetState) {
                    if (diff >= col.warnDays && diff < col.dangerDays) {
                        elem.classList.add("state-warning");
                    } else {
                        elem.classList.add("state-danger");
                    }
                }
            }

            const bthElem = document.querySelector("#col-BTH");
            if (bthElem) {
                bthElem.classList.remove("state-success", "state-warning");
                if (dayOfWeek === 2 || dayOfWeek === 6) {
                    bthElem.classList.add("state-warning");
                } else {
                    bthElem.classList.add("state-success");
                }
            }

            const exeElem = document.querySelector("#col-EXE");
            if (exeElem) {
                exeElem.classList.remove("state-success", "state-warning");
                if (dayOfWeek === 4 || dayOfWeek === 0) {
                    exeElem.classList.add("state-warning");
                } else {
                    exeElem.classList.add("state-success");
                }
            }
        }

        async function renderUIFromDB() {
            const { sections: savedSections, currentEditing } = await loadAllDataFromDB();

            document.querySelectorAll(".collapsible").forEach(el => el.remove());

            const totalElem = document.querySelector("#total-section-value, .total");

            if (savedSections && savedSections.length > 0) {
                savedSections.sort((a, b) => a.index - b.index);
                savedSections.forEach(data => {
                    const section = createCollapsibleSection(data.index + 1, data);
                    dailyContainer.insertBefore(section, totalElem);
                });
            } else {
                for (let i = 1; i <= 3; i++) {
                    const section = createCollapsibleSection(i);
                    dailyContainer.insertBefore(section, totalElem);
                }
            }

            updateSectionTotals();

            if (currentEditing !== null && currentEditing !== undefined) {
                const sections = document.querySelectorAll(".collapsible");
                if (sections[currentEditing]) {
                    const targetContent = sections[currentEditing].querySelector(".content");
                    targetContent.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }
        }

        // --- Core Section Functions ---
        function createCollapsibleSection(index, savedData = null) {
            const container = document.createElement("div");
            container.className = "collapsible";
            if (savedData && savedData["is-activated"]) {
                container.classList.add("active");
            }

            const defaultTitle = savedData ? savedData.sectionName : `Section ${index}`;

            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "btn-collapsible";
            btn.setAttribute("data-total", savedData ? savedData["section-total"] : "0");
            btn.textContent = defaultTitle;

            const delBtn = document.createElement("div");
            delBtn.className = "del-collapsible";
            delBtn.style.display = "none";
            delBtn.textContent = "DELETE";

            btn.appendChild(delBtn);

            const content = document.createElement("div");
            content.className = "content";
            content.contentEditable = "true";

            const savedTextArray = (savedData && savedData["section-text"]) ? savedData["section-text"] : [];
            const lineCount = Math.max(40, savedTextArray.length);

            for (let i = 0; i < lineCount; i++) {
                const p = document.createElement("p");
                let lineText = "";

                if (savedTextArray[i] !== undefined) {
                    lineText = savedTextArray[i];
                } else if (i === 0) {
                    lineText = defaultTitle;
                }

                if (lineText.trim() === "") {
                    p.appendChild(document.createElement("br"));
                } else {
                    p.textContent = lineText;
                }
                content.appendChild(p);
            }

            container.appendChild(btn);
            container.appendChild(content);
            return container;
        }

        function updateSectionTotals() {
            const sections = document.querySelectorAll(".collapsible");
            let grandTotal = 0;
            let sumExceptLast = 0;

            sections.forEach((section, idx) => {
                const btn = section.querySelector(".btn-collapsible");
                const content = section.querySelector(".content");
                const paragraphs = content.querySelectorAll("p");

                if (paragraphs.length === 0) return;

                const firstPText = paragraphs[0].textContent.trim();
                const titleText = firstPText || `Section ${idx + 1}`;

                if (btn.firstChild && btn.firstChild.nodeType === Node.TEXT_NODE) {
                    btn.firstChild.nodeValue = titleText;
                } else if (btn.childNodes.length > 0) {
                    btn.childNodes[0].nodeValue = titleText;
                } else {
                    btn.textContent = titleText;
                }

                let totalValue = 0;
                for (let i = 1; i < paragraphs.length; i++) {
                    const pText = paragraphs[i].textContent || "";
                    const cleanedText = pText.trim();
                    if (!cleanedText) continue;

                    const words = cleanedText.split(/\s+/);
                    words.forEach(word => {
                        if (!word) return;

                        if (/[xX]/.test(word)) {
                            const parts = word.split(/[xX]/);
                            let product = 1;
                            let isValid = true;

                            for (let j = 0; j < parts.length; j++) {
                                const numStr = parts[j].replace(/,/g, "").trim();
                                const num = parseFloat(numStr);
                                if (isNaN(num)) {
                                    isValid = false;
                                    break;
                                }
                                product *= num;
                            }

                            if (isValid && parts.length > 1) {
                                totalValue += product * 1000;
                            }
                        } else {
                            const numStr = word.replace(/[.,]/g, "").trim();
                            const num = parseFloat(numStr);
                            if (!isNaN(num)) {
                                totalValue += num * 1000;
                            }
                        }
                    });
                }

                const formattedTotal = totalValue.toLocaleString("en-US");
                btn.setAttribute("data-total", formattedTotal);
                grandTotal += totalValue;

                if (idx < sections.length - 1) {
                    sumExceptLast += totalValue;
                }
            });

            const countExceptLast = Math.max(0, sections.length - 1);
            const avgValue = countExceptLast > 0 ? (sumExceptLast / countExceptLast) : 0;

            const totalDisplay = document.querySelector("#total-section-value, .total");
            if (totalDisplay) {
                totalDisplay.innerHTML = `
                    <a><sup>${countExceptLast} · ${avgValue.toLocaleString("en-US")}</sup></a><br>
                    <a>${grandTotal.toLocaleString("en-US")}</a>
                `;
            }

            // Save aggregate metrics into STORE_APP_STATE
            saveStateToDB("grandTotal", grandTotal);
            saveStateToDB("averageValue", avgValue);
            saveStateToDB("lastUpdated", new Date().toISOString());
        }

        // --- Application Initialization ---
        async function initApp() {
            await initDB();
            await renderWeeklyUI();
            await renderUIFromDB();
        }

        initApp();

        // --- Click Checking Helper ---
        let preventToggle = false;

        function isClickOnAfter(e, btn) {
            const rect = btn.getBoundingClientRect();
            const afterStyle = window.getComputedStyle(btn, "::after");

            const afterWidth = parseFloat(afterStyle.width) || 24;
            const clickX = e.clientX - rect.left;

            return clickX >= (rect.width - afterWidth - 10);
        }

        // --- Event Listeners ---
        document.querySelector("#weekly").addEventListener("dblclick", function (e) {
            const col = e.target.closest(".weekly-col");
            if (!col) return;

            const key = col.getAttribute("data-key");
            if (["TRIM", "CIP_T", "CIP_D"].includes(key)) {
                const resetBtn = col.querySelector(".weekly-btn-reset");
                if (resetBtn) {
                    resetBtn.classList.toggle("active");
                }
            }
        });

        document.querySelector("#weekly").addEventListener("click", async function (e) {
            const resetBtn = e.target.closest(".weekly-btn-reset");
            if (resetBtn) {
                const col = resetBtn.closest(".weekly-col");
                const key = col.getAttribute("data-key");

                saveStateToDB(`PATIENT_ZERO_${key}_RESET`, true);
                resetBtn.classList.remove("active");
                await renderWeeklyUI();
            }
        });

        document.body.addEventListener("dblclick", function (e) {
            const btnCollapsible = e.target.closest(".btn-collapsible");
            if (btnCollapsible && isClickOnAfter(e, btnCollapsible)) {
                preventToggle = true;
                setTimeout(() => { preventToggle = false; }, 300);

                const delBtn = btnCollapsible.querySelector(".del-collapsible");
                if (delBtn) {
                    delBtn.style.display = delBtn.style.display === "none" ? "block" : "none";
                }
            }
        });

        document.body.addEventListener("click", async function (e) {
            const delBtn = e.target.closest("div.del-collapsible");
            if (delBtn) {
                const parentCollapsible = delBtn.closest(".collapsible");
                if (parentCollapsible) {
                    parentCollapsible.remove();
                    updateSectionTotals();
                    await syncAllToDB();
                }
                return;
            }

            const btnCollapsible = e.target.closest(".btn-collapsible");
            if (btnCollapsible) {
                if (preventToggle || isClickOnAfter(e, btnCollapsible)) {
                    return;
                }

                const parentCollapsible = btnCollapsible.closest(".collapsible");
                if (parentCollapsible) {
                    parentCollapsible.classList.toggle("active");

                    const sections = Array.from(document.querySelectorAll(".collapsible"));
                    const sectionIndex = sections.indexOf(parentCollapsible);
                    if (sectionIndex !== -1) {
                        saveSectionToDB(sectionIndex);
                    }
                }
                return;
            }

            const btnAdd = e.target.closest("#btn-add-collapsible");
            if (btnAdd) {
                const rect = btnAdd.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const isThirtyPercentLeft = clickX <= (rect.width * 0.3);

                if (isThirtyPercentLeft) {
                    const backupInput = document.querySelector("#backup-collapsible");
                    if (backupInput) {
                        backupInput.classList.toggle("active");
                        if (backupInput.classList.contains("active")) {
                            await updateBackupInputFromDB();
                            backupInput.scrollIntoView({ behavior: "smooth", block: "center" });
                        } else {
                            const collapsibles = document.querySelectorAll(".collapsible.active");
                            const lastCollapsible = collapsibles[collapsibles.length - 1];
                            if (lastCollapsible) {
                                lastCollapsible.scrollIntoView({ behavior: "smooth", block: "center" });
                            }
                        }
                    }
                    return;
                }

                const totalTarget = document.querySelector(".total, #total-section-value");
                const count = document.querySelectorAll(".collapsible").length + 1;
                const newSection = createCollapsibleSection(count);
                dailyContainer.insertBefore(newSection, totalTarget);
                updateSectionTotals();

                saveSectionToDB(count - 1);
                return;
            }
        });

        document.body.addEventListener("change", function (e) {
            if (e.target.matches("#backup-collapsible")) {
                applyBackupToDBAndUI(e.target.value);
            }
        });

        document.body.addEventListener("keydown", function (e) {
            const content = e.target.closest(".content");
            if (!content) return;

            if (e.key === "Enter") {
                e.preventDefault();
                return;
            }

            const selection = window.getSelection();
            if (!selection.rangeCount) return;

            const targetP = selection.anchorNode.nodeType === Node.TEXT_NODE
                ? selection.anchorNode.parentElement
                : selection.anchorNode;

            const paragraphs = Array.from(content.querySelectorAll("p"));
            const pIndex = paragraphs.indexOf(targetP);

            if (pIndex > 0) {
                const allowedKeys = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Tab", "Home", "End", "Space"];
                if (!allowedKeys.includes(e.key) && !e.ctrlKey && !e.metaKey && !/^[0-9xX.,\s]$/.test(e.key)) {
                    e.preventDefault();
                    return;
                }
            }

            if (e.key === "Backspace" || e.key === "Delete") {
                const range = selection.getRangeAt(0);

                if (e.key === "Backspace" && range.startOffset === 0) {
                    if (!selection.isCollapsed) {
                        e.preventDefault();
                        targetP.innerHTML = "<br>";
                        updateSectionTotals();
                    } else {
                        e.preventDefault();
                    }
                }

                if (e.key === "Delete" && range.endOffset === (targetP.textContent || "").length) {
                    if (!selection.isCollapsed) {
                        e.preventDefault();
                        targetP.innerHTML = "<br>";
                        updateSectionTotals();
                    } else {
                        e.preventDefault();
                    }
                }
            }
        });

        document.body.addEventListener("input", function (e) {
            const content = e.target.closest(".content");
            if (!content) return;

            const paragraphs = Array.from(content.querySelectorAll("p"));
            paragraphs.forEach((p, index) => {
                if (index > 0) {
                    const cleaned = p.textContent.replace(/[^0-9xX.,\s]/g, "");
                    if (p.textContent !== cleaned) {
                        p.textContent = cleaned;
                    }
                }

                if (p.textContent.trim() === "" && !p.querySelector("br")) {
                    p.innerHTML = "<br>";
                }
            });

            const lastP = paragraphs[paragraphs.length - 1];
            if (lastP && lastP.textContent.trim() !== "") {
                const newP = document.createElement("p");
                newP.appendChild(document.createElement("br"));
                content.appendChild(newP);
            }

            updateSectionTotals();

            const sections = Array.from(document.querySelectorAll(".collapsible"));
            const currentSection = content.closest(".collapsible");
            const sectionIndex = sections.indexOf(currentSection);

            if (sectionIndex !== -1) {
                saveSectionToDB(sectionIndex);
            }
        });
    </script>
</body>
